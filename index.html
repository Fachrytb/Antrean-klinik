<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueCare - Sistem Antrean Poli Umum</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= HALAMAN LOGIN ================= -->
    <div id="halamanLogin" class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-hospital-fill login-icon"></i>
                <h2>QueueCare</h2>
                <p>Sistem Antrean Poli Umum</p>
            </div>

            <div class="login-body">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="Masukkan username">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Masukkan password">
                    </div>
                </div>

                <button class="btn btn-primary w-100 py-2" onclick="login()">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>

                <div id="status" class="status-message mt-3"></div>
            </div>
        </div>
    </div>

    <!-- ================= HALAMAN DASHBOARD ================= -->
    <div id="halamanDashboard" class="d-none">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="bi bi-hospital-fill"></i> QueueCare
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="display.html" target="_blank" class="btn btn-light btn-sm">
                        <i class="bi bi-tv"></i> Buka Display
                    </a>
                    <button class="btn btn-danger btn-sm" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4 px-4">
            <!-- Statistik Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-primary">
                        <div class="stat-icon"><i class="bi bi-megaphone-fill"></i></div>
                        <div>
                            <div class="stat-label">Nomor Saat Ini</div>
                            <div class="stat-value" id="nomorSaatIni">-</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-warning">
                        <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
                        <div>
                            <div class="stat-label">Menunggu</div>
                            <div class="stat-value" id="jumlahMenunggu">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-success">
                        <div class="stat-icon"><i class="bi bi-check-circle-fill"></i></div>
                        <div>
                            <div class="stat-label">Selesai</div>
                            <div class="stat-value" id="jumlahSelesai">0</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-info">
                        <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                        <div>
                            <div class="stat-label">Total Hari Ini</div>
                            <div class="stat-value" id="jumlahTotal">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Kolom Input Pasien -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary-custom text-white">
                            <i class="bi bi-person-plus-fill"></i> Input Pasien Baru
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Nama Pasien <span class="text-danger">*</span></label>
                                <input type="text" id="namaPasien" class="form-control" placeholder="Contoh: Budi Santoso">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Umur <span class="text-danger">*</span></label>
                                <input type="number" id="umurPasien" class="form-control" placeholder="Contoh: 25">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Jenis Kelamin <span class="text-danger">*</span></label>
                                <select id="jkPasien" class="form-select">
                                    <option value="">-- Pilih --</option>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                            <button class="btn btn-primary w-100" onclick="simpanPasien()">
                                <i class="bi bi-save-fill"></i> Simpan & Buat Antrean
                            </button>
                            <div id="pesanInput" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Kolom Daftar Antrean -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary-custom text-white d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-list-ol"></i> Daftar Antrean Hari Ini</span>
                            <button class="btn btn-sm btn-light" onclick="panggilBerikutnya()">
                                <i class="bi bi-megaphone-fill"></i> Panggil Berikutnya
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>No</th>
                                            <th>Nomor</th>
                                            <th>Nama</th>
                                            <th>Waktu</th>
                                            <th>Status</th>
                                            <th class="text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabelAntrean">
                                        <!-- Data akan diisi oleh JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                            <div id="pesanKosong" class="text-center text-muted py-4 d-none">
                                <i class="bi bi-inbox fs-1"></i>
                                <p class="mb-0">Belum ada antrean hari ini</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JS (module) -->
    <script type="module" src="main.js"></script>
    <script type="module">
        // Expose fungsi ke window agar bisa dipanggil dari HTML
        import { login, logout, simpanPasien, panggilBerikutnya, selesaikanAntrean, batalkanAntrean, cekLogin } from './main.js'
        
        window.login = login
        window.logout = logout
        window.simpanPasien = simpanPasien
        window.panggilBerikutnya = panggilBerikutnya
        window.selesaikanAntrean = selesaikanAntrean
        window.batalkanAntrean = batalkanAntrean

        // Cek status login saat halaman dimuat
        cekLogin()
    </script>
</body>
</html>
