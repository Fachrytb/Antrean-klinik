<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Antrean - QueueCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tombol kecil "aktifkan suara" - hanya muncul jika browser memblokir audio */
        #btnSuaraKecil {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(13, 110, 253, 0.95);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            animation: pulseSuara 1.5s infinite;
        }
        #btnSuaraKecil:hover { background: #0b5ed7; }
        @keyframes pulseSuara {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
    </style>
<base target="_blank">
</head>
<body class="display-body">

    <!-- Tombol kecil - hanya muncul otomatis jika suara diblokir browser -->
    <button id="btnSuaraKecil" onclick="aktifkanSuara()">
        <i class="bi bi-volume-up-fill"></i> Aktifkan Suara
    </button>

    <div class="display-container">
        <!-- Header Display -->
        <div class="display-header">
            <h1><i class="bi bi-hospital-fill"></i> POLI UMUM</h1>
            <p id="jamDisplay">--:--:--</p>
        </div>

        <!-- Konten Utama -->
        <div class="display-main">
            <!-- Nomor Sedang Dipanggil -->
            <div class="display-current">
                <div class="label">NOMOR ANTREAN</div>
                <div class="nomor-besar" id="nomorDipanggil">-</div>
                <div class="nama-pasien" id="namaDipanggil">-</div>
                <div class="pesan-poli">
                    <i class="bi bi-arrow-right-circle-fill"></i> SILAKAN MENUJU POLI UMUM
                </div>
            </div>

            <!-- Antrean Berikutnya -->
            <div class="display-next">
                <div class="next-title">Antrean Berikutnya</div>
                <div class="next-list" id="listBerikutnya">
                    <div class="next-empty">-</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="display-footer">
            <p>Mohon menunggu nomor Anda dipanggil</p>
        </div>
    </div>

    <!-- Audio untuk suara panggilan -->
    <audio id="audioPanggil" preload="auto">
        <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
    </audio>

    <script type="module" src="main.js"></script>
    <script type="module">
        import { initDisplay, aktifkanSuara } from './main.js'
        window.aktifkanSuara = aktifkanSuara
        initDisplay()
    </script>
</body>
</html>
