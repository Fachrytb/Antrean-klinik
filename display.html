<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Antrean - QueueCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Overlay aktivasi suara - wajib klik agar browser mengizinkan audio */
        #aktivasiSuara {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #aktivasiSuara .btn-aktivasi {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: 18px 42px;
            font-size: 1.4rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #aktivasiSuara .btn-aktivasi:hover {
            background: #0b5ed7;
        }
    </style>
<base target="_blank">
</head>
<body class="display-body">

    <!-- Overlay: klik untuk mengaktifkan suara (kebijakan autoplay browser) -->
    <div id="aktivasiSuara" style="display:none;">
        <button class="btn-aktivasi" onclick="aktifkanSuara()">
            <i class="bi bi-volume-up-fill"></i> Klik untuk Mengaktifkan Suara
        </button>
    </div>

    <div class="display-container">
        <!-- Header Display -->
        <div class="display-header">
            <h1><i class="bi bi-hospital-fill"></i> POLI UMUM</h1>
            <p id="jamDisplay">--:--:--</p>
        </div>

        <!-- Konten Utama -->
        <div class="display-main">
            <!-- Nomor Sedang Dipanggil -->
            <div class="display-current">
                <div class="label">NOMOR ANTREAN</div>
                <div class="nomor-besar" id="nomorDipanggil">-</div>
                <div class="nama-pasien" id="namaDipanggil">-</div>
                <div class="pesan-poli">
                    <i class="bi bi-arrow-right-circle-fill"></i> SILAKAN MENUJU POLI UMUM
                </div>
            </div>

            <!-- Antrean Berikutnya -->
            <div class="display-next">
                <div class="next-title">Antrean Berikutnya</div>
                <div class="next-list" id="listBerikutnya">
                    <div class="next-empty">-</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="display-footer">
            <p>Mohon menunggu nomor Anda dipanggil</p>
        </div>
    </div>

    <!-- Audio untuk suara panggilan -->
    <audio id="audioPanggil" preload="auto">
        <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
    </audio>

    <script type="module" src="main.js"></script>
    <script type="module">
        import { initDisplay, aktifkanSuara } from './main.js'
        // Expose ke window agar bisa dipanggil dari onclick HTML
        window.aktifkanSuara = aktifkanSuara
        // Inisialisasi display saat halaman dimuat
        initDisplay()
    </script>
</body>
</html>
